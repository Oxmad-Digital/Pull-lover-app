<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f0eeec;
      padding: 40px 20px;
    }

    /* ── SWITCHER ── */
    .switcher {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
    }
    .switcher button {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1.5px solid #E5E7EB;
      background: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: #555;
    }
    .switcher button.active,
    .switcher button:hover {
      background: #243B3B;
      color: #fff;
      border-color: #243B3B;
    }

    /* ── ÉTATS ── */
    .state { display: none; }
    .state.visible { display: block; }

    /* ── PAGE ── */
    .verify-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
      background: #FFF9F6;
      border-radius: 16px;
    }

    /* ── ORBES ── */
    .verify-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      border-radius: 16px;
      overflow: hidden;
    }
    .verify-bg span {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
    }
    .verify-bg span:nth-child(1) {
      width: 600px; height: 600px;
      background: #C75C5C;
      top: -15%; left: -10%;
      opacity: 0.22;
      animation: orb-drift-a 44s ease-in-out infinite;
    }
    .verify-bg span:nth-child(2) {
      width: 500px; height: 500px;
      background: #AD4646;
      bottom: -18%; right: -8%;
      opacity: 0.18;
      animation: orb-drift-b 52s ease-in-out infinite;
    }
    .verify-bg span:nth-child(3) {
      width: 340px; height: 340px;
      background: #C75C5C;
      top: 45%; left: 50%;
      opacity: 0.12;
      animation: orb-drift-c 38s ease-in-out infinite;
    }
    .verify-bg span:nth-child(4) {
      width: 260px; height: 260px;
      background: #243B3B;
      top: 18%; right: 16%;
      opacity: 0.06;
      animation: orb-drift-b 60s ease-in-out infinite reverse;
    }

    @keyframes orb-drift-a {
      0%, 100% { transform: translate(0, 0) scale(1); }
      40%       { transform: translate(50px, -70px) scale(1.06); }
      70%       { transform: translate(-35px, 45px) scale(0.96); }
    }
    @keyframes orb-drift-b {
      0%, 100% { transform: translate(0, 0) scale(1); }
      35%       { transform: translate(-60px, 50px) scale(1.04); }
      65%       { transform: translate(40px, -55px) scale(0.97); }
    }
    @keyframes orb-drift-c {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%       { transform: translate(-45px, -60px) scale(1.08); }
    }

    /* ── CARD ── */
    .verify-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 10px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 50px rgba(199, 92, 92,0.08);
      animation: card-in 0.5s ease;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── ICÔNE ── */
    .verify-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
    }
    .verify-icon.success { background: #fdf5f5; color: #C75C5C; }
    .verify-icon.error   { background: #fee2e2; color: #dc2626; }

    /* ── TITRES & TEXTE ── */
    .verify-card h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      font-family: 'Montserrat', sans-serif;
    }
    .verify-card p {
      font-size: 14px;
      color: #555;
      font-family: 'Montserrat', sans-serif;
      line-height: 1.5;
    }
    .verify-card p + p { margin-top: -8px; }

    /* ── BOUTON ── */
    .verify-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 50px;
      background: #243B3B;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.03em;
      text-decoration: none;
      transition: background 0.2s ease;
      margin-top: 4px;
    }
    .verify-btn:hover { background: #C75C5C; }

    /* ── SPINNER ── */
    .verify-spinner {
      width: 52px; height: 52px;
      border: 3px solid #E5E7EB;
      border-top-color: #C75C5C;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="switcher">
    <button class="active" onclick="show('loading', this)">Chargement</button>
    <button onclick="show('success', this)">Succès</button>
    <button onclick="show('error', this)">Erreur</button>
  </div>

  <!-- ÉTAT : LOADING -->
  <div class="state visible" id="state-loading">
    <div class="verify-page">
      <div class="verify-bg"><span></span><span></span><span></span><span></span></div>
      <div class="verify-card">
        <div class="verify-spinner"></div>
        <h1>Vérification en cours…</h1>
        <p>Veuillez patienter quelques instants.</p>
      </div>
    </div>
  </div>

  <!-- ÉTAT : SUCCÈS -->
  <div class="state" id="state-success">
    <div class="verify-page">
      <div class="verify-bg"><span></span><span></span><span></span><span></span></div>
      <div class="verify-card">
        <div class="verify-icon success">✓</div>
        <h1>Email vérifié !</h1>
        <p>Votre adresse e-mail a bien été confirmée.</p>
        <p>Vous allez être redirigé vers la connexion…</p>
      </div>
    </div>
  </div>

  <!-- ÉTAT : ERREUR -->
  <div class="state" id="state-error">
    <div class="verify-page">
      <div class="verify-bg"><span></span><span></span><span></span><span></span></div>
      <div class="verify-card">
        <div class="verify-icon error">✕</div>
        <h1>Vérification échouée</h1>
        <p>Le lien est invalide ou a expiré.</p>
        <a href="#" class="verify-btn">Retour à l'inscription</a>
      </div>
    </div>
  </div>

  <script>
    function show(state, btn) {
      document.querySelectorAll('.state').forEach(el => el.classList.remove('visible'));
      document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('active'));
      document.getElementById('state-' + state).classList.add('visible');
      btn.classList.add('active');
    }
  </script>

</body>
</html>
